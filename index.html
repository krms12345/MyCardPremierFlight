<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCard Flappy Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="ui-layer">
            <div id="score-display">0</div>
            
            <div id="start-screen" class="screen active">
                <div class="logo">
                    <h1>MyCard</h1>
                    <p>Premier Flight</p>
                </div>
                <button id="start-btn" class="premium-btn">Tap to Fly</button>
            </div>

            <div id="game-over-screen" class="screen">
                <h2>Game Over</h2>
                <div class="score-board">
                    <div class="score-item">
                        <span>Score</span>
                        <span id="final-score">0</span>
                    </div>
                    <div class="score-item">
                        <span>Best</span>
                        <span id="best-score">0</span>
                    </div>
                </div>
                <button id="restart-btn" class="premium-btn">Play Again</button>
            </div>
        </div>
    </div>
    
    <!-- Hidden image for canvas drawing -->
    <img id="cardImage" src="mycard-premier-digital-card-1536x969.png" style="display: none;" alt="MyCard">

    <script src="script.js"></script>
</body>
</html>
